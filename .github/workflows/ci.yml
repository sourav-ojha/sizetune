# Quality gate. Inactive until the repo is pushed to GitHub (human step).
# Pair with a branch ruleset on `main` requiring PR + this check ("verify"), no bypass, BEFORE connecting Cloudflare Workers Builds
# (Workers Builds deploys every push to the production branch regardless of this workflow).
name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04   # Chrome preinstalled (Playwright channel: 'chrome'); pinned so image migration is deliberate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4      # version comes from the "packageManager" field in package.json
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: CI=1 pnpm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results/ }
  cross-browser:
    # Firefox + WebKit (Playwright builds). Written on macOS, NOT yet run on Linux CI; treat the first run as a trial.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: PW_ALL_BROWSERS=1 CI=1 pnpm exec playwright test --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results-cross-browser, path: test-results/ }
