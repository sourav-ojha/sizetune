# Quality gate + gated deploys (see deploy-* jobs below).
# Pair with a branch ruleset on `main` requiring PR + this check ("verify"), no bypass, BEFORE connecting Cloudflare Workers Builds
# (Workers Builds deploys every push to the production branch regardless of this workflow).
name: ci
# Docs-only changes do not trigger CI or deploys. A run is skipped ONLY if every changed file matches paths-ignore; any other
# file (src/, tests/, e2e/, scripts/, public/, config, lockfile, this workflow) still runs the full pipeline. '*.md' is root-level
# only on purpose: src/content/** guides are site content and must still build, test and deploy. If a branch ruleset ever
# requires the "verify" check, a skipped docs-only PR would wait forever for it: re-evaluate this filter at that point.
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'QA/**'
      - 'AUDIT/**'
      - '.product/**'
      - '.claude/**'
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'QA/**'
      - 'AUDIT/**'
      - '.product/**'
      - '.claude/**'
permissions:
  contents: read
# Only superseded PR runs are cancelled. A push run that is already running (possibly mid-deploy) is never cancelled by a newer push; GitHub keeps at most one waiting run per group, so a newer push replaces an older still-waiting one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04   # Chrome preinstalled (Playwright channel: 'chrome'); pinned so image migration is deliberate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0      # version comes from the "packageManager" field in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: CI=1 pnpm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-results, path: test-results/ }
  cross-browser:
    # Firefox + WebKit (Playwright builds), one job per browser shard. The suite is ~400 tests at workers: 1 (~9 min serial);
    # install overhead is only ~1 min, so the win is parallelism, not caching/Docker. Firefox runs 2 shards and WebKit 3, so each job
    # stays near the `verify` job's runtime and cross-browser stays off the critical path. Test files, projects, retries and env are unchanged.
    name: cross-browser (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-24.04
    # The test run is ~4 minutes. `playwright install --with-deps` is the variable part: it normally takes under a minute, but on a slow
    # runner the ~250 apt packages WebKit needs have taken 17 to 23+ minutes (observed 2026-11-18, cancelled at the old 20 minute limit
    # with a few packages left, before any test ran). The limit leaves room for that; healthy runs are unaffected.
    timeout-minutes: 35
    strategy:
      fail-fast: false   # let every browser/shard finish so one failure doesn't hide others
      matrix:
        include:
          - { browser: firefox, shard: 1, total: 2 }
          - { browser: firefox, shard: 2, total: 2 }
          # WebKit is ~2x slower than Firefox on the Linux runner, so it gets 3 shards (measured: 5.3 min for shard 1/2).
          - { browser: webkit, shard: 1, total: 3 }
          - { browser: webkit, shard: 2, total: 3 }
          - { browser: webkit, shard: 3, total: 3 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: PW_ALL_BROWSERS=1 CI=1 pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: 'playwright-results-cross-browser-${{ matrix.browser }}-${{ matrix.shard }}', path: test-results/ }

  # ---- Deploys: only after BOTH quality jobs are green, only on push (never on pull_request). ----
  # dev -> Worker "sizetune-staging" (workers.dev). main -> Worker "sizetune" (sizetune.com).
  # Secrets live in GitHub ENVIRONMENTS (staging / production), not repo secrets, and are exposed only to the wrangler step
  # (never to install/build, which run third-party code). Staging skips, not fails, until its secrets exist.
  deploy-staging:
    needs: [verify, cross-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets not set; skipping deploy."; fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm run build
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: [verify, cross-browser]
    # Needs the repo VARIABLE PRODUCTION_DEPLOY_ENABLED=true (a deliberate switch, off by default) AND the secrets.
    # Also uses the "production" environment: add a required reviewer there so every deploy waits for a human click.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
